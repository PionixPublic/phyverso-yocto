settings:
  telemetry_enabled: true
active_modules:
  persistent_store:
    module: PersistentStore
    config_module:
      sqlite_db_file_path: /etc/everest/everest_persistent_store.db
    connections: {}

  setup:
    config_module:
      localization: true
      setup_simulation: false
      setup_wifi: true
    connections:
      store:
      - module_id: persistent_store
        implementation_id: main
    module: Setup

  api:
    connections:
      evse_manager:
      # uncomment unused evse_managers
      - implementation_id: evse
        module_id: evse_manager_port1
      - implementation_id: evse
        module_id: evse_manager_port2
    module: API

  auth:
    module: Auth
    config_module:
      connection_timeout: 10
      selection_algorithm: PlugEvents
    connections:
      token_provider:
      # uncomment unused token_providers
      - module_id: token_provider_port1
        implementation_id: main
      - module_id: token_provider_port2
        implementation_id: main
      token_validator:
      - module_id: token_validator
        implementation_id: main
      evse_manager:
      # uncomment unused evse_managers
      - module_id: evse_manager_port1
        implementation_id: evse
      - module_id: evse_manager_port2
        implementation_id: evse

  energy_manager:
    connections:
      energy_trunk:
      - implementation_id: energy_grid
        module_id: grid_connection_point
    module: EnergyManager

  grid_connection_point:
    config_module:
      fuse_limit_A: 63
      phase_count: 3
    connections:
      energy_consumer:
      # uncomment unused evse_managers
      - implementation_id: energy_grid
        module_id: evse_manager_port1
      - implementation_id: energy_grid
        module_id: evse_manager_port2
    module: EnergyNode

  evse_security:
    module: EvseSecurity

  token_validator:
    config_implementation:
      main:
        sleep: 0.25
        validation_reason: Token seems valid
        validation_result: Accepted
    connections: {}
    module: DummyTokenValidator

  phyverso_mcu:
    module: PhyVersoBSP
    config_module:
      ### General
      serial_port: /dev/ttyS6
      reset_gpio_bank: 3
      ### Port 1 config
      conn1_max_current_A_import: 16
      conn1_max_phase_count_import: 1
      conn1_dc: true # set to "true" if evse_manager_port1 is for DC config; false for AC
      #conn1_motor_lock_type: 1 # default value: -1, meaning no motor lock -> DC never has motor lock on EVSE side
      conn1_gpio_stop_button_enabled: false
      conn1_gpio_stop_button_bank: gpiochip2
      conn1_gpio_stop_button_pin: 36
      ### Port 2 config
      conn2_max_current_A_import: 16
      conn2_max_phase_count_import: 1
      conn2_dc: true # set to "true" if evse_manager_port1 is for DC config; false for AC
      #conn2_motor_lock_type: 1 # default value: -1, meaning no motor lock -> DC never has motor lock on EVSE side
      conn2_gpio_stop_button_enabled: false
      conn2_gpio_stop_button_bank: gpiochip2
      conn2_gpio_stop_button_pin: 37

### BEGIN
# RS485 Config
# PLEASE COMMENT OUT FOLLOWING BLOCK IF NO RS485 devices used
###
  serial_comm_hub:
    module: SerialCommHub
    config_implementation:
      main:
        serial_port: /dev/ttyS4
        baudrate: 9600 # you will have to adjust this to suit the configuration of the devices on the bus
        rxtx_gpio_line: 44
        rxtx_gpio_chip: gpiochip3
        rxtx_gpio_tx_high: true
### END
# RS485 Config
###

################### PORT 1 ###################

### BEGIN
# Token providers for port 1
# COMMENT OUT FOLLOWING BLOCK IF UNUSED
###
  token_provider_port1:
    config_implementation:
      main:
        timeout: 10
        token: DEADBEEF
        type: RFID
    connections:
      evse:
      - implementation_id: evse
        module_id: evse_manager_port1
    module: DummyTokenProvider
### END
# Token providers for port 1
###

### BEGIN
# ISO / SLAC config for port 1
# -> this can be used for AC or DC configs
# PLEASE COMMENT OUT FOLLOWING BLOCK IF NO ISO/HLC USED ON PORT 1
###
  iso_port1:
    config_module:
      device: seth0
    connections:
      security:
      - implementation_id: main
        module_id: evse_security
    module: EvseV2G
  slac_port1:
    config_implementation:
      main:
        device: seth0
        number_of_sounds: 10
        link_status_detection: true
    connections: {}
    module: EvseSlac
### END
# ISO / SLAC config for port 1
###

