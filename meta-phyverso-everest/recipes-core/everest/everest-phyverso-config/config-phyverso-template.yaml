### BEGIN
# EVSE Manager DC config for port 2
# PLEASE COMMENT OUT FOLLOWING BLOCK IF UNUSED OR AC CONFIG USED FOR PORT 2
###
  evse_manager_port1:
    config_module:
      charge_mode: DC
      evse_id: DE*PNX*E1234567*1
      payment_enable_contract: false
      payment_enable_eim: true
      session_logging: true
      session_logging_path: /tmp/logs
      connector_id: 1
    connections:
      bsp:
      - implementation_id: connector_1
        module_id: phyverso_mcu
      hlc:
      - implementation_id: charger
        module_id: iso_port1
      slac:
      - implementation_id: main
        module_id: slac_port1
      # establish connections to your PSU/IMD/Meter here
      powersupply_DC:
        - module_id: powersupply_port1
          implementation_id: main
      imd:
        - module_id: imd_port1
          implementation_id: main
      powermeter_car_side:
        - module_id: powersupply_port1
          implementation_id: powermeter
    module: EvseManager
    telemetry:
      id: 1
### END
# EVSE Manager DC config for port 2
###

