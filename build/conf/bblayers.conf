# POKY_BBLAYERS_CONF_VERSION is increased each time build/conf/bblayers.conf
# changes incompatibly
POKY_BBLAYERS_CONF_VERSION = "2"

BBPATH = "${TOPDIR}"
BBFILES ?= ""

OEROOT := "${@os.path.abspath(os.path.dirname(d.getVar('FILE', True)) + '/..')}"

# In our BSPs active layers are defined by the manifest.xml for all BSPs. The
# bblayers.conf gets created by the init_bblayers.py script.
BBLAYERS ?= ""
BBLAYERS += "\
  ${OEROOT}/../../source/poky/meta \
  ${OEROOT}/../../source/poky/meta-poky \
  ${OEROOT}/../../source/meta-openembedded/meta-oe \
  ${OEROOT}/../../source/meta-openembedded/meta-networking \
  ${OEROOT}/../../source/meta-openembedded/meta-python \
  ${OEROOT}/../../source/meta-openembedded/meta-multimedia \
  ${OEROOT}/../../source/meta-openembedded/meta-filesystems \
  ${OEROOT}/../../source/meta-openembedded/meta-perl \
  ${OEROOT}/../../source/meta-rauc \
  ${OEROOT}/../../source/meta-security \
  ${OEROOT}/../../source/meta-security/meta-tpm \
  ${OEROOT}/../../source/meta-ampliphy \
  ${OEROOT}/../../source/meta-phytec \
  ${OEROOT}/../../source/meta-basecamp \
  ${OEROOT}/../meta-phyverso-basecamp \
  ${OEROOT}/../../source/meta-phyverso-evcs \
  ${OEROOT}/../../source/meta-lumissil-greenphy \
  ${OEROOT}/../../source/meta-ti/meta-ti-bsp \
  ${OEROOT}/../../source/meta-ti/meta-ti-extras \
  ${OEROOT}/../../source/meta-arm/meta-arm \
  ${OEROOT}/../../source/meta-arm/meta-arm-toolchain \
  "
