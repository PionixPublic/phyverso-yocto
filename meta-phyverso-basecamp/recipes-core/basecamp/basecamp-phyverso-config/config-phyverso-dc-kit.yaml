settings:
  telemetry_enabled: false
active_modules:
  api:
    connections:
      evse_manager:
      - implementation_id: evse
        module_id: evse_manager_dc
    module: API
  auth:
    module: Auth
    config_module:
      connection_timeout: 10
      selection_algorithm: PlugEvents
    connections:
      token_provider:
      - module_id: token_provider_dc
        implementation_id: main
      token_validator:
      - module_id: token_validator
        implementation_id: main
      evse_manager:
      - module_id: evse_manager_dc
        implementation_id: evse
  energy_manager:
    connections:
      energy_trunk:
      - implementation_id: energy_grid
        module_id: grid_connection_point
    module: EnergyManager
#
# DC Charger on Port 1
#
  evse_manager_dc:
    config_module:
      cable_check_wait_number_of_imd_measurements: 10 
      charge_mode: DC
      evse_id: DE*PNX*E1234567*1
      payment_enable_contract: false
      payment_enable_eim: true
      session_logging: true
      session_logging_path: /tmp/logs
      connector_id: 1
    connections:
      bsp:
      - implementation_id: connector_1
        module_id: phyverso_mcu
      hlc:
      - implementation_id: charger
        module_id: iso_dc
      slac:
      - implementation_id: main
        module_id: slac_dc
      powersupply_DC:
        - module_id: powersupply_dc
          implementation_id: main
      imd:
        - module_id: imd_dc
          implementation_id: main
 #     powermeter_car_side:
 #       - module_id: powermeter_dc
 #         implementation_id: main
    module: EvseManager
    telemetry:
      id: 1

  powersupply_dc:
    config_module:
      # hier checken, ob am richtigen port angeschlossen bzw. ggf aendern
      can_device: main_mcan0
      max_export_current_A: 80
      max_export_power_W: 20000
    module: Huawei_R100040Gx

  # in unsere aufbau haengt der bender via USB umsetzer am phyverso
  # hier muessen wir gemeinsam schauen, wie/ob wir den auch direkt an
  # einen der rs485 ports ran kriegen
  imd_dc:
    config_implementation:
      main:
        # hier auch eventuell aendern
        imd_device_id: 3
    connections:
      serial_comm_hub:
        - implementation_id: main
          module_id: comm_hub
    module: Bender_isoCHA425HV
  comm_hub:
    config_implementation:
      main:
        # wie man sieht, ist war der bei uns via USB umsetzer angeschlossen
        # also hier muessen wir auf jeden fall noch anpassen
        serial_port: /dev/ttyS4
        baudrate: 19200
        parity: 0
        rxtx_gpio_line: 44
        rxtx_gpio_chip: gpiochip2
        rxtx_gpio_tx_high: true
    module: SerialCommHub

  iso_dc:
    config_module:
      device: seth0
    connections:
      security:
      - implementation_id: main
        module_id: evse_security
    module: EvseV2G
  slac_dc:
    config_implementation:
      main:
        device: seth0
        number_of_sounds: 10
        link_status_detection: true
    connections: {}
    module: EvseSlac

#
#
#
  grid_connection_point:
    config_module:
      fuse_limit_A: 100
      phase_count: 3
    connections:
      energy_consumer:
      - implementation_id: energy_grid
        module_id: evse_manager_dc
    module: EnergyNode
  evse_security:
    module: EvseSecurity
  persistent_store:
    module: PersistentStore
    config_module:
      sqlite_db_file_path: /etc/everest/everest_persistent_store.db
    connections: {}
  setup:
    config_module:
      localization: true
      setup_simulation: false
      setup_wifi: true
    connections:
      store:
      - module_id: persistent_store
        implementation_id: main
    module: Setup
  token_provider_dc:
    config_implementation:
      main:
        timeout: 120
        token: DEADBEEF
        type: RFID
        connector_id: 1
    connections:
      evse:
      - implementation_id: evse
        module_id: evse_manager_dc
    module: DummyTokenProvider
  token_validator:
    config_implementation:
      main:
        sleep: 0.25
        validation_reason: Token seems valid
        validation_result: Accepted
    connections: {}
    module: DummyTokenValidator
  phyverso_mcu:          
    module: PhyVersoBSP
    config_module:
      conn1_dc: true
      conn1_max_current_A_import: 32
      conn1_max_current_A_export: 32

      reset_gpio_bank: 2
      conn1_motor_lock_type: 1
      conn2_motor_lock_type: 1
      serial_port: /dev/ttyS6
  
  # noch zu parametrieren
#  powermeter_dc:
#    module: LemDCBM400600
#    config_module:
#      ip_address: '192.168.4.2'
      #port:
